<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reset your password</title>
  </head>
  <body>
    <article id="article">
      <h1>How to reset your password</h1>
      <ol>
        <li>Open the sign-in page and choose "Forgot password".</li>
        <li>Enter the e-mail address you registered with.</li>
        <li>Open the link we send you within 30 minutes and choose a new password.</li>
      </ol>
      <p>If the e-mail does not arrive, check your spam folder or contact support.</p>
    </article>
  </body>
</html>
